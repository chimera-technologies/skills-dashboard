name: SDLC push

# Generated by /sdlc:init from .sdlc/sdlc.json (bala-chimera/sdlc-marketplace@v0.16.3).
# After a merge to main: the next stage for each merged artifact, and the tests.
# Do not edit by hand: change .sdlc/ and re-run init, or upgrade with
# init_project.py --upgrade <tag>.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rerun:
        description: "Re-run one step for one merged file"
        type: choice
        options: [intent-to-spec, spec-to-stories, stack, build]
      file:
        description: "intent/<slug>.md, specs/<slug>.md or releases/<version>.md"
        required: true

permissions:
  contents: read

jobs:
  intent-to-spec:
    if: github.event_name == 'push' || inputs.rerun == 'intent-to-spec'
    uses: bala-chimera/sdlc-marketplace/.github/workflows/sdlc-intent-to-spec.yml@v0.16.3
    with:
      sdlc_ref: v0.16.3
      sdlc_repo: bala-chimera/sdlc-marketplace
      app_id: ${{ vars.SDLC_APP_ID }}
      base_branch: main
      jira_base_url: ${{ vars.JIRA_BASE_URL }}
      jira_user_email: ${{ vars.JIRA_USER_EMAIL }}
      model: claude-opus-5-5
      intent_file: ${{ inputs.rerun == 'intent-to-spec' && inputs.file || '' }}
      ui_design: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SDLC_APP_PRIVATE_KEY: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

  spec-to-stories:
    if: github.event_name == 'push' || inputs.rerun == 'spec-to-stories'
    uses: bala-chimera/sdlc-marketplace/.github/workflows/sdlc-spec-to-stories.yml@v0.16.3
    with:
      sdlc_ref: v0.16.3
      sdlc_repo: bala-chimera/sdlc-marketplace
      app_id: ${{ vars.SDLC_APP_ID }}
      base_branch: main
      jira_base_url: ${{ vars.JIRA_BASE_URL }}
      jira_user_email: ${{ vars.JIRA_USER_EMAIL }}
      spec_file: ${{ inputs.rerun == 'spec-to-stories' && inputs.file || '' }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SDLC_APP_PRIVATE_KEY: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

  stack:
    if: github.event_name == 'push' || inputs.rerun == 'stack'
    uses: bala-chimera/sdlc-marketplace/.github/workflows/sdlc-spec-to-stack.yml@v0.16.3
    with:
      sdlc_ref: v0.16.3
      sdlc_repo: bala-chimera/sdlc-marketplace
      app_id: ${{ vars.SDLC_APP_ID }}
      base_branch: main
      jira_base_url: ${{ vars.JIRA_BASE_URL }}
      jira_user_email: ${{ vars.JIRA_USER_EMAIL }}
      model: claude-sonnet-5
      spec_file: ${{ inputs.rerun == 'stack' && inputs.file || '' }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SDLC_APP_PRIVATE_KEY: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

  build:
    if: github.event_name == 'push' || inputs.rerun == 'build'
    uses: bala-chimera/sdlc-marketplace/.github/workflows/sdlc-build.yml@v0.16.3
    with:
      sdlc_ref: v0.16.3
      sdlc_repo: bala-chimera/sdlc-marketplace
      app_id: ${{ vars.SDLC_APP_ID }}
      base_branch: main
      jira_base_url: ${{ vars.JIRA_BASE_URL }}
      jira_user_email: ${{ vars.JIRA_USER_EMAIL }}
      model: claude-opus-5-5
      spec_file: ${{ inputs.rerun == 'build' && inputs.file || '' }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SDLC_APP_PRIVATE_KEY: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

  tests:
    if: github.event_name == 'push'
    uses: bala-chimera/sdlc-marketplace/.github/workflows/sdlc-main-tests.yml@v0.16.3
    with:
      sdlc_ref: v0.16.3
      sdlc_repo: bala-chimera/sdlc-marketplace
      app_id: ${{ vars.SDLC_APP_ID }}
      base_branch: main
      jira_base_url: ${{ vars.JIRA_BASE_URL }}
      jira_user_email: ${{ vars.JIRA_USER_EMAIL }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SDLC_APP_PRIVATE_KEY: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
