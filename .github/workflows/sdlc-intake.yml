name: SDLC intake

# Generated by /sdlc:init from .sdlc/sdlc.json (chimera-technologies/sdlc-marketplace@v0.21.0).
# Plan: a Jira ticket (repository_dispatch from Jira Automation) or a signal becomes an intent PR.
# Do not edit by hand: change .sdlc/ and re-run init, or upgrade with
# init_project.py --upgrade <tag>.

on:
  repository_dispatch:
    types: [create-intent]
  workflow_dispatch:
    inputs:
      source:
        type: choice
        options: [jira, maintain, claude-security, claude-tag]
        default: jira
      record_id:
        description: "Jira key, or none"
        default: none
      fingerprint:
        description: "Dedup key for non-Jira sources (a-z, 0-9, -)"
        default: ""
      signal:
        description: "Signal JSON for non-Jira sources"
        default: "{}"

permissions:
  contents: read

jobs:
  intake:
    concurrency:
      group: sdlc-intake-${{ github.event.client_payload.record_id || inputs.record_id }}-${{ github.event.client_payload.fingerprint || inputs.fingerprint }}
    uses: chimera-technologies/sdlc-marketplace/.github/workflows/sdlc-intake.yml@v0.21.0
    with:
      sdlc_ref: v0.21.0
      sdlc_repo: chimera-technologies/sdlc-marketplace
      app_id: ${{ vars.SDLC_APP_ID }}
      base_branch: main
      jira_base_url: ${{ vars.JIRA_BASE_URL }}
      jira_user_email: ${{ vars.JIRA_USER_EMAIL }}
      model: claude-sonnet-5
      source: ${{ github.event.client_payload.source || inputs.source }}
      record_id: ${{ github.event.client_payload.record_id || inputs.record_id || 'none' }}
      fingerprint: ${{ github.event.client_payload.fingerprint || inputs.fingerprint || '' }}
      signal: ${{ github.event.client_payload.signal && toJSON(github.event.client_payload.signal) || inputs.signal || '{}' }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SDLC_APP_PRIVATE_KEY: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
