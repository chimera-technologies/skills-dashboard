name: SDLC pull request

# Generated by /sdlc:init from .sdlc/sdlc.json (bala-chimera/sdlc-marketplace@v0.16.1).
# Every PR: the gates of the stages it touches, and PR review then Test for story PRs.
# Do not edit by hand: change .sdlc/ and re-run init, or upgrade with
# init_project.py --upgrade <tag>.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  intent-check:
    uses: bala-chimera/sdlc-marketplace/.github/workflows/sdlc-intent-check.yml@v0.16.1
    with:
      sdlc_ref: v0.16.1
      sdlc_repo: bala-chimera/sdlc-marketplace
      app_id: ${{ vars.SDLC_APP_ID }}
      base_branch: main
      jira_base_url: ${{ vars.JIRA_BASE_URL }}
      jira_user_email: ${{ vars.JIRA_USER_EMAIL }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SDLC_APP_PRIVATE_KEY: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

  spec-check:
    uses: bala-chimera/sdlc-marketplace/.github/workflows/sdlc-spec-check.yml@v0.16.1
    with:
      sdlc_ref: v0.16.1
      sdlc_repo: bala-chimera/sdlc-marketplace
      app_id: ${{ vars.SDLC_APP_ID }}
      base_branch: main
      jira_base_url: ${{ vars.JIRA_BASE_URL }}
      jira_user_email: ${{ vars.JIRA_USER_EMAIL }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SDLC_APP_PRIVATE_KEY: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

  design-check:
    if: github.event.action != 'closed'
    uses: bala-chimera/sdlc-marketplace/.github/workflows/sdlc-design-check.yml@v0.16.1
    with:
      sdlc_ref: v0.16.1
      sdlc_repo: bala-chimera/sdlc-marketplace
      app_id: ${{ vars.SDLC_APP_ID }}
      base_branch: main
      jira_base_url: ${{ vars.JIRA_BASE_URL }}
      jira_user_email: ${{ vars.JIRA_USER_EMAIL }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SDLC_APP_PRIVATE_KEY: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

  pr:
    if: github.event.action != 'closed'
    uses: bala-chimera/sdlc-marketplace/.github/workflows/sdlc-pr.yml@v0.16.1
    with:
      sdlc_ref: v0.16.1
      sdlc_repo: bala-chimera/sdlc-marketplace
      app_id: ${{ vars.SDLC_APP_ID }}
      base_branch: main
      jira_base_url: ${{ vars.JIRA_BASE_URL }}
      jira_user_email: ${{ vars.JIRA_USER_EMAIL }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SDLC_APP_PRIVATE_KEY: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

  story-link:
    if: github.event.action == 'closed'
    uses: bala-chimera/sdlc-marketplace/.github/workflows/sdlc-story-link.yml@v0.16.1
    with:
      sdlc_ref: v0.16.1
      sdlc_repo: bala-chimera/sdlc-marketplace
      app_id: ${{ vars.SDLC_APP_ID }}
      base_branch: main
      jira_base_url: ${{ vars.JIRA_BASE_URL }}
      jira_user_email: ${{ vars.JIRA_USER_EMAIL }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SDLC_APP_PRIVATE_KEY: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
