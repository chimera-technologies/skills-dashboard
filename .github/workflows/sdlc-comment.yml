name: SDLC comment

# Generated by /sdlc:init from .sdlc/sdlc.json (chimera-technologies/sdlc-marketplace@v0.20.0).
# PR comments: '/sdlc revise <request>' on an intent, spec or plan PR revises it on its branch.
# Do not edit by hand: change .sdlc/ and re-run init, or upgrade with
# init_project.py --upgrade <tag>.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  revise:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/sdlc revise')
    uses: chimera-technologies/sdlc-marketplace/.github/workflows/sdlc-revise.yml@v0.20.0
    with:
      sdlc_ref: v0.20.0
      sdlc_repo: chimera-technologies/sdlc-marketplace
      app_id: ${{ vars.SDLC_APP_ID }}
      base_branch: main
      jira_base_url: ${{ vars.JIRA_BASE_URL }}
      jira_user_email: ${{ vars.JIRA_USER_EMAIL }}
      model: claude-opus-5-5
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SDLC_APP_PRIVATE_KEY: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
