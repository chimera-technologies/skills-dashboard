name: SDLC maintain

# Generated by /sdlc:init from .sdlc/sdlc.json (bala-chimera/sdlc-marketplace@v0.14.0).
# Maintain: run the checks in .sdlc/maintain.json; each breach becomes an intent via the intake.
# Do not edit by hand: change .sdlc/ and re-run init, or upgrade with
# init_project.py --upgrade <tag>.

on:
  schedule:
    - cron: "17 * * * *"   # maintain_cron in .sdlc/sdlc.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: bala-chimera/sdlc-marketplace/.github/workflows/sdlc-maintain.yml@v0.14.0
    with:
      sdlc_ref: v0.14.0
      sdlc_repo: bala-chimera/sdlc-marketplace
      app_id: ${{ vars.SDLC_APP_ID }}
      base_branch: main
      jira_base_url: ${{ vars.JIRA_BASE_URL }}
      jira_user_email: ${{ vars.JIRA_USER_EMAIL }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SDLC_APP_PRIVATE_KEY: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
